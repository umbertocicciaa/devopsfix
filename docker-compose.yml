services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://backend:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
