stages:
  - build
  - test
  - deploy

variables:
  NODE_VERSION: "18"

build-job:
  stage: build
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test-job:
  stage: test
  image: node:${NODE_VERSION}
  script:
    - npm ci
    - npm test
  coverage: '/Coverage: \d+\.\d+/'

deploy-production:
  stage: deploy
  script:
    - echo "Deploying to production"
  only:
    - main
  when: manual
